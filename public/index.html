<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3edf7">
  <meta name="description" content="Upload and share files up to 20 MB, no account required.">
  <title>Simple file sharing · MewPocket</title>
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/mewpocket-512.png">
  <link rel="icon" type="image/svg+xml" href="/assets/mewpocket.svg?v=2">
  <link rel="stylesheet" href="/styles.css?v=mewpocket-batch-2">
  <script src="/cdn-rotation.js?v=mewpocket-hybrid-2" defer></script>
  <script src="/batch-ui.js?v=mewpocket-1" defer></script>
  <script src="/upload-queue.js?v=mewpocket-1" defer></script>
  <script src="/app.js?v=mewpocket-14" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="dark-sky" aria-hidden="true">
    <div class="sky-canvas">
      <span class="stars stars-1"></span>
      <span class="stars stars-2"></span>
      <span class="stars stars-3"></span>
      <span class="moon"></span>
      <span class="meteor m1"></span>
      <span class="meteor m2"></span>
      <span class="meteor m3"></span>
    </div>
  </div>
  <div class="light-sky" aria-hidden="true">
    <span class="day-horizon"></span>
    <span class="day-sun"></span>
    <span class="day-cloud cloud-1"></span>
    <span class="day-cloud cloud-2"></span>
    <span class="day-cloud cloud-3"></span>
    <span class="sakura-petal petal-1"></span>
    <span class="sakura-petal petal-2"></span>
    <span class="sakura-petal petal-3"></span>
    <span class="sakura-petal petal-4"></span>
    <span class="sakura-petal petal-5"></span>
  </div>
  <div id="app"></div>
</body>
</html>

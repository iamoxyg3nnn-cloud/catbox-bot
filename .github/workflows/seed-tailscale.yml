name: Seed Tailscale key to spokes (temporary)

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Copy TAILSCALE_AUTH_KEY into every spoke repo
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
          KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            repo="mew-pocket/catbox-bot-$i"
            gh secret set TAILSCALE_AUTH_KEY --repo "$repo" --body "$KEY"
            echo "seeded $repo"
          done

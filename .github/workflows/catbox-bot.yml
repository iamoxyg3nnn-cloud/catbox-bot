name: Catbox Bot (Supabase metadata)

# Runs on a windows-latest GitHub-hosted runner. This workflow exists only to
# keep the Catbox control plane online. Supabase/Redis are hosted by a SEPARATE
# workflow in the mew-pocket/Supabase-Actions repo; they must overlap because
# the bot uses them for metadata. Each service owns its own Cloudflare tunnel,
# so concurrent sessions do not fight over ingress.
#
# The Windows runner's D: drive (~150 GiB) is used ONLY as transient staging
# for upload bodies (D:\catbox_staging). Tailscale + RDP expose the session to
# the operator; neither supplies durable storage. Discord remains the only byte
# store, and a staged body is deleted only after Discord confirms the upload.
#
# Never scheduled: no `schedule`/cron trigger, now or later. workflow_dispatch
# is the only trigger. Each run queues its own successor, which waits in the
# catbox-session group and starts the moment this run ends, so the bot stays up
# 24/7 by chaining rather than by a timer. The successor always runs the
# default branch. A full keep-alive resets the retry counter; repeated failures
# are retried 5 links, then the chain stops and alerts instead of looping.

on:
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'session-chain:<n> (automatic) | blank if manual'
        required: false
        default: ''

concurrency:
  group: catbox-session
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # a run queues its own successor

jobs:
  catbox:
    name: catbox-control-plane
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Queue the next session (early insurance)
        # Runs before the bot so a session lost later (dead runner, cancel,
        # timeout) still has a successor waiting. Queued pessimistically as a
        # retry; the end-of-run step replaces it with a reset counter when the
        # session is healthy.
        if: always()
        shell: pwsh
        env:
          TRIGGERED_BY: ${{ inputs.triggered_by }}
          CHAIN_REF: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          $n = 0
          if ($env:TRIGGERED_BY -match '^session-chain:(\d{1,9})$') { $n = [int]$Matches[1] }
          $maxRetries = 5
          if (($n + 1) -gt $maxRetries) {
            Write-Host "Retry budget spent ($n/$maxRetries) - not queueing."
            exit 0
          }
          $body = @{
            ref = $env:CHAIN_REF
            inputs = @{ triggered_by = "session-chain:$($n + 1)" }
          } | ConvertTo-Json -Compress -Depth 5
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/workflows/catbox-bot.yml/dispatches"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          foreach ($attempt in 1..3) {
            try {
              Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
              Write-Host "Successor queued for $env:CHAIN_REF (retry $($n + 1)/$maxRetries)."
              exit 0
            } catch {
              Write-Warning "Dispatch attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
            }
          }
          Write-Error "Could not queue the next session from the insurance step."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 'Prepare local D: staging'
        shell: pwsh
        run: |
          # Transient bytes only. The app deletes each staged file from here as
          # soon as Discord confirms the attachment and Supabase records it.
          New-Item -ItemType Directory -Force -Path 'D:\catbox_staging' | Out-Null
          Write-Host "Staging directory ready: D:\catbox_staging"

      - name: Enable Tailscale RDP access
        if: env.TAILSCALE_AUTH_KEY != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # GitHub-hosted runners inject proxy variables that hijack
          # tailscaled's control-plane TLS handshake ("Tailscale is starting").
          foreach ($v in 'ALL_PROXY','all_proxy','HTTP_PROXY','HTTPS_PROXY','http_proxy','https_proxy') {
            Remove-Item "Env:$v" -ErrorAction SilentlyContinue
          }

          try {
            $msi = "$env:RUNNER_TEMP\tailscale-setup.msi"
            if (-not (Test-Path $msi)) {
              Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' \
                -OutFile $msi -UseBasicParsing -TimeoutSec 120
            }
            $rc = (Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/quiet', '/norestart') -Wait -PassThru).ExitCode
            if ($rc -ne 0) { throw "Tailscale MSI install exited $rc" }

            $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
            if (-not (Test-Path $ts)) { throw "tailscale.exe not found after install" }

            Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
            Start-Service -Name TermService -ErrorAction SilentlyContinue
            Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0 -ErrorAction SilentlyContinue
            New-NetFirewallRule -DisplayName 'Catbox operator RDP' -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue | Out-Null

            $rdpUser = 'catbox-rdp'
            $password = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 20 | ForEach-Object { [char]$_ })
            & net user $rdpUser $password /add /y 2>&1 | Out-Null
            & net localgroup administrators $rdpUser /add /y 2>&1 | Out-Null

            $hostname = "catbox-rdp-$env:GITHUB_RUN_ID"
            $upArgs = @('up', "--authkey=$env:TAILSCALE_AUTH_KEY", "--hostname=$hostname", '--accept-dns=false', '--timeout=120s', '--reset')
            & $ts @upArgs 2>&1 | ForEach-Object { Write-Host "tailscale: $_" }

            $ip = ''
            for ($i = 0; $i -lt 18; $i++) {
              $ip = (& $ts ip -4 2>$null | Out-String).Trim()
              if ($ip -match '^\d+\.\d+\.\d+\.\d+$') { break }
              Start-Sleep -Seconds 5
            }

            if ($ip -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              # Some runners cannot bring up the WinTun adapter. Retry with the
              # userspace daemon, as the reference fleet does.
              Write-Warning 'Tailscale WinTun did not come up; retrying with userspace networking.'
              Stop-Service -Name Tailscale -Force -ErrorAction SilentlyContinue
              Get-Process tailscaled -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 3
              $stateDir = "$env:TEMP\CatboxTailscaleUserspace"
              New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
              $stateFile = Join-Path $stateDir 'server-state.conf'
              $tsd = "$env:ProgramFiles\Tailscale\tailscaled.exe"
              Start-Process -FilePath $tsd -ArgumentList @("--state=`"$stateFile`"", '--tun=userspace-networking') -WindowStyle Hidden -ErrorAction SilentlyContinue | Out-Null
              Start-Sleep -Seconds 20
              & $ts @upArgs 2>&1 | ForEach-Object { Write-Host "tailscale(userspace): $_" }
              for ($i = 0; $i -lt 24; $i++) {
                $ip = (& $ts ip -4 2>$null | Out-String).Trim()
                if ($ip -match '^\d+\.\d+\.\d+\.\d+$') { break }
                Start-Sleep -Seconds 5
              }
            }

            if ($ip -match '^\d+\.\d+\.\d+\.\d+$') {
              "TS_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append
              Write-Host "======================================="
              Write-Host "  CATBOX RDP (this session only)"
              Write-Host "  mstsc /v:$ip"
              Write-Host "  user: $rdpUser"
              Write-Host "  pass: $password"
              Write-Host "======================================="
            } else {
              # RDP is an operator convenience, not a dependency of the bot.
              Write-Warning 'Tailscale did not obtain an IPv4 address - RDP disabled, control plane will still start.'
            }
          } catch {
            Write-Warning "Tailscale/RDP setup failed: $($_.Exception.Message) - control plane will still start."
          }

      - name: Tailscale RDP not configured
        if: env.TAILSCALE_AUTH_KEY == ''
        shell: pwsh
        run: Write-Warning 'TAILSCALE_AUTH_KEY is not set - RDP access is disabled. Add the secret to enable it.'

      - name: Write runtime configuration
        shell: pwsh
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_BOT_2_TOKEN: ${{ secrets.DISCORD_BOT_2_TOKEN }}
          DISCORD_BOT_3_TOKEN: ${{ secrets.DISCORD_BOT_3_TOKEN }}
          DISCORD_BOT_4_TOKEN: ${{ secrets.DISCORD_BOT_4_TOKEN }}
          DISCORD_BOT_5_TOKEN: ${{ secrets.DISCORD_BOT_5_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_UPLOAD_SECRET: ${{ secrets.NODE_UPLOAD_SECRET }}
        run: |
          # config.parseBots() consumes DISCORD_BOTS as a JSON array. The shared
          # production channel comes from the existing secret, so a channel move
          # only needs one secret changed. primary stays first because the
          # metadata mirror uses bots[0].
          $channel = $env:DISCORD_CHANNEL_ID
          $fleet = @(
            @{ id = 'primary'; token = $env:DISCORD_BOT_TOKEN; channelId = $channel },
            @{ id = 'bot2'; token = $env:DISCORD_BOT_2_TOKEN; channelId = $channel },
            @{ id = 'bot3'; token = $env:DISCORD_BOT_3_TOKEN; channelId = $channel },
            @{ id = 'bot4'; token = $env:DISCORD_BOT_4_TOKEN; channelId = $channel },
            @{ id = 'bot5'; token = $env:DISCORD_BOT_5_TOKEN; channelId = $channel }
          )
          $botsJson = $fleet | ConvertTo-Json -Compress -Depth 5

          @"
          PORT=3000
          PUBLIC_BASE_URL=$env:PUBLIC_BASE_URL
          TRUST_PROXY=1
          DATA_DIR=./data
          STAGING_DIR=D:\catbox_staging
          MAX_FILE_SIZE=20mb
          FILE_DELIVERY=proxy
          DISCORD_BOT_ID=primary
          DISCORD_BOTS=$botsJson
          DISCORD_CHANNEL_ID=$env:DISCORD_CHANNEL_ID
          SUPABASE_URL=$env:SUPABASE_URL
          SUPABASE_SERVICE_ROLE_KEY=$env:SUPABASE_SERVICE_ROLE_KEY
          NODE_UPLOAD_SECRET=$env:NODE_UPLOAD_SECRET
          "@ | Set-Content -Path .env -Encoding utf8

          # The app reads process.env directly, so export the fleet to later
          # steps (including the long-running control plane) via GITHUB_ENV.
          "DISCORD_BOTS=$botsJson" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Runtime configuration written for $($fleet.Count) Discord bots (tokens are masked in logs)."

      - name: Require durable metadata config
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_BOT_2_TOKEN: ${{ secrets.DISCORD_BOT_2_TOKEN }}
          DISCORD_BOT_3_TOKEN: ${{ secrets.DISCORD_BOT_3_TOKEN }}
          DISCORD_BOT_4_TOKEN: ${{ secrets.DISCORD_BOT_4_TOKEN }}
          DISCORD_BOT_5_TOKEN: ${{ secrets.DISCORD_BOT_5_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          NODE_UPLOAD_SECRET: ${{ secrets.NODE_UPLOAD_SECRET }}
        run: |
          # A fresh runner has an empty ./data directory. If any of these are
          # blank the app silently falls back to local SQLite and every
          # metadata write disappears at the next session, which looks exactly
          # like a database flush. Fail loudly instead.
          $missing = @()
          foreach ($name in 'SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY','DISCORD_BOT_TOKEN','DISCORD_BOT_2_TOKEN','DISCORD_BOT_3_TOKEN','DISCORD_BOT_4_TOKEN','DISCORD_BOT_5_TOKEN','DISCORD_CHANNEL_ID','NODE_UPLOAD_SECRET') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Error "::error::$name is empty - refusing to start on an ephemeral runner"
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) { exit 1 }
          Write-Host 'Durable metadata configuration present.'

      - name: Apply metadata schema
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $sql = Get-Content -Raw -Path 'infra/supabase/schema.sql'
          $payload = @{ sql = $sql } | ConvertTo-Json -Compress -Depth 5
          $headers = @{
            apikey = $env:SUPABASE_SERVICE_ROLE_KEY
            Authorization = "Bearer $env:SUPABASE_SERVICE_ROLE_KEY"
          }

          # Supabase is hosted by a separate workflow. Wait for its metadata
          # endpoint rather than racing it (a 502 here used to fail the job).
          Write-Host 'Waiting for Supabase metadata endpoint...'
          $ready = $false
          foreach ($i in 1..120) {
            try {
              $response = Invoke-WebRequest -Uri "$env:SUPABASE_URL/rest/v1/" -Headers @{ apikey = $env:SUPABASE_SERVICE_ROLE_KEY } -UseBasicParsing -TimeoutSec 15 -SkipHttpErrorCheck
              $code = [int]$response.StatusCode
              # Cloudflare 530 means a dead tunnel. Only real HTTP answers count.
              if ($code -ge 200 -and $code -lt 500) {
                $ready = $true
                Write-Host "Supabase ready after $i checks (HTTP $code)."
                break
              }
            } catch { } # Cloudflare 530 or a timeout - keep waiting.
            Start-Sleep -Seconds 10
          }
          if (-not $ready) { Write-Error '::error::Supabase never became ready'; exit 1 }

          Invoke-RestMethod -Method Post -Uri "$env:SUPABASE_URL/functions/v1/migrate" -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
          Write-Host 'Metadata schema applied (idempotent).'

      - name: Seed Discord bot registry
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          # Keep the Supabase registry in sync with the configured fleet so the
          # admin console shows every bot actually used for uploads.
          $fleet = @($env:DISCORD_BOTS | ConvertFrom-Json)
          $rows = @($fleet | ForEach-Object {
            @{
              bot_id = $_.id
              channel_id = $_.channelId
              enabled = $true
              health = 'unknown'
            }
          })
          $body = $rows | ConvertTo-Json -Compress -Depth 5 -AsArray
          Invoke-RestMethod -Method Post -Uri "$env:SUPABASE_URL/rest/v1/discord_bots" `
            -Headers @{
              apikey = $env:SUPABASE_SERVICE_ROLE_KEY
              Authorization = "Bearer $env:SUPABASE_SERVICE_ROLE_KEY"
              Prefer = 'return=minimal,resolution=merge-duplicates'
            } -ContentType 'application/json' -Body $body | Out-Null
          Write-Host "Discord bot registry seeded with $($rows.Count) bots."

      - name: Install cloudflared
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\cloudflared.exe"
          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' `
            -OutFile $dest -UseBasicParsing -TimeoutSec 180
          & $dest --version

      - name: Start control plane and keep alive
        shell: pwsh
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_UPLOAD_SECRET: ${{ secrets.NODE_UPLOAD_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          MAX_FILE_SIZE: 20mb
          TRUST_PROXY: '1'
        run: |
          $serverLog = "$env:RUNNER_TEMP\server.log"
          $serverErr = "$env:RUNNER_TEMP\server.err"
          $tunnelLog = "$env:RUNNER_TEMP\tunnel.log"
          $tunnelErr = "$env:RUNNER_TEMP\tunnel.err"
          Set-Content -Path $serverLog -Value ''
          Set-Content -Path $serverErr -Value ''
          Set-Content -Path $tunnelLog -Value ''
          Set-Content -Path $tunnelErr -Value ''

          # The app reads process.env directly (no dotenv loader). Set the
          # non-secret values here; secrets arrive via the step env block.
          $env:PORT = '3000'
          $env:STAGING_DIR = 'D:\catbox_staging'
          $env:DATA_DIR = '.\data'
          $env:FILE_DELIVERY = 'proxy'
          $env:DISCORD_BOT_ID = 'primary'

          $nodeExe = (Get-Command node).Source
          $cloudflared = "$env:RUNNER_TEMP\cloudflared.exe"
          $serverProc = Start-Process -FilePath $nodeExe -ArgumentList 'server.js' `
            -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru `
            -RedirectStandardOutput $serverLog -RedirectStandardError $serverErr
          $tunnelProc = Start-Process -FilePath $cloudflared `
            -ArgumentList @('tunnel', '--no-autoupdate', 'run', '--token', $env:CF_TUNNEL_TOKEN) `
            -PassThru -RedirectStandardOutput $tunnelLog -RedirectStandardError $tunnelErr

          try {
            # Readiness: local control plane AND the public tunnel URL.
            $ready = $false
            $deadline = (Get-Date).AddSeconds(180)
            while ((Get-Date) -lt $deadline) {
              if ($serverProc.HasExited) {
                Write-Error "::error::Control plane exited before becoming ready"
                Get-Content $serverLog, $serverErr -Tail 100 -ErrorAction SilentlyContinue
                exit 1
              }
              if ($tunnelProc.HasExited) {
                Write-Error "::error::cloudflared exited before becoming ready"
                Get-Content $tunnelLog, $tunnelErr -Tail 100 -ErrorAction SilentlyContinue
                exit 1
              }
              try {
                $local = Invoke-WebRequest -Uri 'http://localhost:3000/api/config' -UseBasicParsing -TimeoutSec 5 -SkipHttpErrorCheck
                $public = Invoke-WebRequest -Uri "$env:PUBLIC_BASE_URL/api/config" -UseBasicParsing -TimeoutSec 10 -SkipHttpErrorCheck
                if ([int]$local.StatusCode -eq 200 -and [int]$public.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch { } # Not ready yet.
              Start-Sleep -Seconds 5
            }
            if (-not $ready) {
              Write-Error '::error::Control plane did not become publicly ready in 180s'
              Get-Content $serverLog, $serverErr -Tail 100 -ErrorAction SilentlyContinue
              Get-Content $tunnelLog, $tunnelErr -Tail 100 -ErrorAction SilentlyContinue
              exit 1
            }

            Write-Host '======================================='
            Write-Host '        CATBOX CONTROL PLANE READY'
            Write-Host '======================================='
            Write-Host "  Session   : #$env:GITHUB_RUN_NUMBER"
            if ($env:TS_IP) { Write-Host "  RDP       : $env:TS_IP (mstsc)" }
            Write-Host "  Staging   : D:\catbox_staging"
            Write-Host "  Upload API: $env:PUBLIC_BASE_URL/user/api.php"
            Write-Host "  Metrics   : $env:PUBLIC_BASE_URL/api/metrics"
            Write-Host "  Ops       : $env:PUBLIC_BASE_URL/ops"
            Write-Host '======================================='

            # Keep alive: stream logs, watch both processes, hold the session
            # open. 330 min, not the 360 min job cap: a run killed by the cap
            # never reaches SESSION_COMPLETE and would count as a failed link.
            $end = (Get-Date).AddMinutes(330)
            $serverLines = 0
            $tunnelLines = 0
            while ((Get-Date) -lt $end) {
              if ($serverProc.HasExited) {
                Write-Error "::error::Control plane exited unexpectedly (exit code $($serverProc.ExitCode))"
                Get-Content $serverLog, $serverErr -Tail 200 -ErrorAction SilentlyContinue
                exit 1
              }
              if ($tunnelProc.HasExited) {
                Write-Error "::error::cloudflared exited unexpectedly (exit code $($tunnelProc.ExitCode))"
                Get-Content $tunnelLog, $tunnelErr -Tail 200 -ErrorAction SilentlyContinue
                exit 1
              }

              $all = @(Get-Content $serverLog -ErrorAction SilentlyContinue)
              if ($all.Count -gt $serverLines) {
                $all[$serverLines..($all.Count - 1)] | ForEach-Object { Write-Host $_ }
                $serverLines = $all.Count
              }
              $all = @(Get-Content $tunnelLog -ErrorAction SilentlyContinue)
              if ($all.Count -gt $tunnelLines) {
                $all[$tunnelLines..($all.Count - 1)] | ForEach-Object { Write-Host $_ }
                $tunnelLines = $all.Count
              }

              $code = 0
              try {
                $probe = Invoke-WebRequest -Uri "$env:PUBLIC_BASE_URL/api/config" -UseBasicParsing -TimeoutSec 10 -SkipHttpErrorCheck
                $code = [int]$probe.StatusCode
              } catch { } # Record HTTP 0 for this heartbeat.
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Catbox alive (PID $($serverProc.Id)) - HTTP $code"
              Start-Sleep -Seconds 30
            }

            'SESSION_COMPLETE=true' | Out-File -FilePath $env:GITHUB_ENV -Append
          } finally {
            Stop-Process -Id $tunnelProc.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $serverProc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: catbox-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/server.err
            ${{ runner.temp }}/tunnel.log
            ${{ runner.temp }}/tunnel.err
          retention-days: 3
          if-no-files-found: ignore

      - name: Queue the next session (session end)
        # Healthy full keep-alive resets the counter; anything else counts up,
        # and once the budget is spent the chain stops with an alert.
        if: always()
        shell: pwsh
        env:
          TRIGGERED_BY: ${{ inputs.triggered_by }}
          CHAIN_REF: ${{ github.event.repository.default_branch || github.ref_name }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          $n = 0
          if ($env:TRIGGERED_BY -match '^session-chain:(\d{1,9})$') { $n = [int]$Matches[1] }
          $maxRetries = 5
          $next = $n + 1
          if ($env:SESSION_COMPLETE -eq 'true') { $next = 0 }

          $stopReason = ''
          if ($next -gt $maxRetries) {
            $stopReason = "$n sessions in a row ended early or never started"
          } else {
            $body = @{
              ref = $env:CHAIN_REF
              inputs = @{ triggered_by = "session-chain:$next" }
            } | ConvertTo-Json -Compress -Depth 5
            $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/workflows/catbox-bot.yml/dispatches"
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $queued = $false
            foreach ($attempt in 1..3) {
              try {
                Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
                $queued = $true
                break
              } catch {
                Write-Warning "Dispatch attempt $attempt failed: $($_.Exception.Message)"
                if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
              }
            }
            if ($queued) {
              Write-Host "Successor queued for $env:CHAIN_REF (retry $next/$maxRetries)."
              exit 0
            }
            $stopReason = 'GitHub refused the dispatch (see warnings above)'
          }

          Write-Error "::error::Session chain stopped: $stopReason. Bot is down until a run is started."
          if (-not [string]::IsNullOrWhiteSpace($env:ALERT_WEBHOOK_URL)) {
            $content = ":warning: **catbox-bot** session chain stopped: $stopReason. Start a run: https://github.com/$env:GITHUB_REPOSITORY/actions/workflows/catbox-bot.yml"
            $payload = @{ content = $content } | ConvertTo-Json -Compress
            try {
              Invoke-RestMethod -Method Post -Uri $env:ALERT_WEBHOOK_URL -ContentType 'application/json' -Body $payload | Out-Null
              Write-Host 'Discord alert sent.'
            } catch {
              Write-Warning 'Discord alert failed.'
            }
          } else {
            Write-Warning 'ALERT_WEBHOOK_URL not set - no Discord alert sent.'
          }

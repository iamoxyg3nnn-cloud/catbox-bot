name: Bootstrap spoke secrets (one-off)

# TEMPORARY setup helper. Reads this repo's secrets and writes them into a
# freshly created spoke repo, so the token values never have to be pasted or
# logged. Remove this workflow and the BOOTSTRAP_TOKEN secret once all spokes
# are seeded.

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repo, e.g. mew-pocket/catbox-bot-2'
        required: true
      spoke_index:
        description: 'Which bot token: 1=primary .. 5=bot5'
        required: true

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy secrets into target repo
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          SPOKE_INDEX: ${{ inputs.spoke_index }}
          S1: ${{ secrets.DISCORD_BOT_TOKEN }}
          S2: ${{ secrets.DISCORD_BOT_2_TOKEN }}
          S3: ${{ secrets.DISCORD_BOT_3_TOKEN }}
          S4: ${{ secrets.DISCORD_BOT_4_TOKEN }}
          S5: ${{ secrets.DISCORD_BOT_5_TOKEN }}
          C_CHANNEL: ${{ secrets.DISCORD_CHANNEL_ID }}
          C_SUPA_URL: ${{ secrets.SUPABASE_URL }}
          C_SUPA_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          C_NODE_SECRET: ${{ secrets.NODE_UPLOAD_SECRET }}
          C_PUBLIC_URL: ${{ secrets.PUBLIC_BASE_URL }}
          C_ALERT: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          case "$SPOKE_INDEX" in
            1) BOT="$S1" ;;
            2) BOT="$S2" ;;
            3) BOT="$S3" ;;
            4) BOT="$S4" ;;
            5) BOT="$S5" ;;
            *) echo "::error::spoke_index must be 1..5"; exit 1 ;;
          esac
          if [ -z "$BOT" ]; then echo "::error::source bot token is empty"; exit 1; fi

          put() {
            name="$1"; value="$2"
            if [ -z "$value" ]; then echo "skip $name (empty source)"; return; fi
            printf '%s' "$value" | gh secret set "$name" --repo "$TARGET_REPO"
            echo "seeded $name -> $TARGET_REPO"
          }

          put DISCORD_BOT_TOKEN "$BOT"
          put DISCORD_CHANNEL_ID "$C_CHANNEL"
          put SUPABASE_URL "$C_SUPA_URL"
          put SUPABASE_SERVICE_ROLE_KEY "$C_SUPA_KEY"
          put NODE_UPLOAD_SECRET "$C_NODE_SECRET"
          put PUBLIC_BASE_URL "$C_PUBLIC_URL"
          put CONTROL_PLANE_URL "$C_PUBLIC_URL"
          put ALERT_WEBHOOK_URL "$C_ALERT"
          echo 'Bootstrap complete.'
